# Title + logo are now the full-width Pip-Boy banner (config/custom.css +
# images/pip-banner.png). Un-comment these to restore the stock header widgets.
# - greeting:
#     text_size: xl
#     text: "Dakota's Lab"
#
# - logo:
#     icon: mdi-shield-home

- resources:
    cpu: true
    memory: true
    disk: /host
    cputemp: true
    uptime: true
    units: metric
    label: Librem 14

- search:
    provider: duckduckgo
    target: _blank

- datetime:
    text_size: xl
    format:
      dateStyle: medium
      timeStyle: short
